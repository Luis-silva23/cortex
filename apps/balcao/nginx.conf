# Balcão (SPA estática). Este arquivo é um TEMPLATE do nginx oficial (/etc/nginx/templates/*.template): na partida a imagem troca
# ${API_ORIGIN} pelo valor da variável de ambiente do container (origem https da API, ex.: https://api.exemplo.com.br) e grava
# em conf.d. O TLS/HSTS ficam no proxy da frente (deploy/Caddyfile).
#
# ATENÇÃO (nginx): `add_header` num bloco `location` ANULA os do bloco pai. Por isso os cabeçalhos de segurança ficam só no
# `server` e o cache é feito com `expires` (que não usa add_header). Antes, o Cache-Control em `location` fazia os cabeçalhos
# de segurança não serem enviados em nenhuma resposta.
#
# CSP (decisão 108): o Balcão não tem script inline nem recurso de terceiros, então `script-src 'self'` bloqueia script injetado.
# `style-src 'unsafe-inline'` é necessário (os avisos de tela, react-hot-toast, criam <style> em tempo de execução).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # arquivos com hash no nome: cache longo
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # o aplicativo (index.html e rotas internas): nunca em cache, para trazer sempre a versão nova dos arquivos com hash
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
